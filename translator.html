<!DOCTYPE html>
<html>
<head>
  <title>Simple Translator</title>
</head>
<body>
  <h2>Simple Translator</h2>
  <input type="text" id="text" placeholder="Type text here">
  <select id="lang">
    <option value="hi-en">Hindi → English</option>
    <option value="hi-sa">Hindi → Sanskrit</option>
    <option value="en-hi">English → Hindi</option>
  </select>
  <button onclick="translate()">Translate</button>
  <p id="output"></p>

  <script>
    async function translate(){
      const text = document.getElementById("text").value.trim();
      const lang = document.getElementById("lang").value;
      const output = document.getElementById("output");

      if(!text){ output.innerText="❌ Enter some text"; return; }

      if(lang==="hi-sa"){
        // Simple offline dictionary for Hindi → Sanskrit
        const dict = {
          "नमस्ते":"नमः",
          "पानी":"आपः",
          "धरती":"पृथिवी",
          "सूरज":"सूर्यः",
          "चाँद":"चन्द्रः",
          "मित्र":"मित्रः",
          "किताब":"पुस्तकम्",
          "विद्यालय":"विद्यालयः",
          "प्यार":"प्रेमः"
        };
        output.innerText = dict[text] || "❌ Translation not found";
        return;
      }

      // For other translations, use MyMemory API
      let source,target;
      if(lang==="hi-en"){ source="hi"; target="en"; }
      else if(lang==="en-hi"){ source="en"; target="hi"; }

      try{
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}`);
        const data = await res.json();
        output.innerText = data.responseData.translatedText;
      }catch(e){
        output.innerText = "❌ Error! Check internet connection.";
      }
    }
  </script>
</body>
</html>

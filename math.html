<!DOCTYPE html>
<html>
<head>
  <title>Advanced Maths Solver</title>
  <style>
    body{
      font-family: Arial;
      background: linear-gradient(135deg,#141e30,#243b55);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
    }
    .solver{
      background:#1f4068;
      padding:20px;
      width:550px;
      border-radius:12px;
      text-align:center;
    }
    input{
      width:95%;
      padding:10px;
      margin-bottom:10px;
      font-size:16px;
      border-radius:6px;
      border:none;
    }
    button{
      padding:10px 20px;
      font-size:16px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#243b55;
      color:white;
      margin:5px;
    }
    h3{
      min-height:30px;
      margin-top:10px;
    }
    p{
      font-size:14px;
      color:#dcdcdc;
    }
  </style>
</head>
<body>

<div class="solver">
  <h2>🧮 Advanced Maths Solver</h2>
  <input type="text" id="question" placeholder="Type any maths question e.g. 2+3*5 or √16 + 7^2">
  <div>
    <button onclick="solve()">Solve ✅</button>
    <button onclick="clearField()">Clear ❌</button>
  </div>
  <h3 id="answer"></h3>
  <p>Supports: + - * / ^ √ sin cos tan log ln ! (factorial) and brackets</p>
</div>

<script>
// Factorial function
function factorial(n){
  if(n<0) return NaN;
  if(n===0 || n===1) return 1;
  let f=1;
  for(let i=2;i<=n;i++) f*=i;
  return f;
}

// Main solver
function solve(){
  let q = document.getElementById("question").value.trim();
  let answerBox = document.getElementById("answer");

  if(!q){
    answerBox.innerText="❌ Please enter a question";
    return;
  }

  try{
    // Replace √ with Math.sqrt
    let expression = q.replace(/√/g,'Math.sqrt');

    // Replace ^ with **
    expression = expression.replace(/\^/g,'**');

    // Replace sin, cos, tan, log, ln
    expression = expression.replace(/sin/g,'Math.sin')
                           .replace(/cos/g,'Math.cos')
                           .replace(/tan/g,'Math.tan')
                           .replace(/log/g,'Math.log10')
                           .replace(/ln/g,'Math.log');

    // Replace factorial n! with factorial(n)
    expression = expression.replace(/(\d+)!/g,'factorial($1)');

    // Evaluate expression
    let result = eval(expression);

    // Round to 10 decimal places if needed
    if(Number(result) && !Number.isInteger(result)){
      result = result.toFixed(10).replace(/\.?0+$/,"");
    }

    answerBox.innerText = `Answer: ${result}`;
  }catch(e){
    answerBox.innerText = "❌ Invalid question";
  }
}

// Clear input and output
function clearField(){
  document.getElementById("question").value="";
  document.getElementById("answer").innerText="";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>Math Playground</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        text-align: center;
      }

      h1 {
        font-size: 3em;
        margin-top: 40px;
        animation: float 2s ease-in-out infinite;
      }

      .card {
        background: rgba(255, 255, 255, 0.15);
        padding: 30px;
        margin: 40px auto;
        width: 80%;
        max-width: 400px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #ffdd57;
        color: #333;
        transition: transform 0.2s, background 0.2s;
      }

      button:hover {
        transform: scale(1.1);
        background: #ffe97f;
      }

      #fact {
        margin-top: 20px;
        font-size: 1.2em;
      }

      @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
      }
    </style>
  </head>

  <body>
    <h1>🧮 Math Playground</h1>

    <div class="card">
      <p>Click the button to learn a cool math fact!</p>
      <button onclick="newFact()">New Math Fact</button>
      <div id="fact"></div>
    </div>

    <script>
      const facts = [
        "Zero is the only number that cannot be represented in Roman numerals.",
        "A circle has the largest area of any shape with the same perimeter.",
        "The symbol ∞ is called infinity.",
        "Prime numbers have exactly two factors.",
        "The Fibonacci sequence appears in nature."
      ];

      function newFact() {
        const randomIndex = Math.floor(Math.random() * facts.length);
        document.getElementById("fact").textContent = facts[randomIndex];
      }
    </script>
  </body>
</html>
